name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # ── Unit tests (gate) ──────────────────────────────────────────────

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: make test

  # ── Cross-compile builds ───────────────────────────────────────────

  build-star6e:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Star6E toolchain
        run: make toolchain
      - name: Build Star6E venc
        run: make build SOC_BUILD=star6e
      - name: Build Star6E json_cli
        run: make json_cli SOC_BUILD=star6e
      - name: Stage Star6E
        run: make stage SOC_BUILD=star6e
      - name: Verify output
        run: |
          test -x out/star6e/venc
          test -x out/star6e/json_cli
      - name: Upload Star6E staged output
        uses: actions/upload-artifact@v4
        with:
          name: venc-star6e
          # Exclude obj/ — incremental build dirs are not release content
          path: |
            out/star6e/
            !out/star6e/obj/

  build-maruko:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Maruko toolchain
        run: make toolchain-maruko
      - name: Build Maruko venc
        run: make build SOC_BUILD=maruko
      - name: Build Maruko json_cli
        run: make json_cli SOC_BUILD=maruko
      - name: Stage Maruko
        run: make stage SOC_BUILD=maruko
      - name: Verify output
        run: |
          test -x out/maruko/venc
          test -x out/maruko/json_cli
      - name: Upload Maruko staged output
        uses: actions/upload-artifact@v4
        with:
          name: venc-maruko
          path: |
            out/maruko/
            !out/maruko/obj/

  # ── Create/update release ──────────────────────────────────────────

  release:
    runs-on: ubuntu-latest
    needs: [build-star6e, build-maruko]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Star6E artifact
        uses: actions/download-artifact@v4
        with:
          name: venc-star6e
          path: release/star6e

      - name: Download Maruko artifact
        uses: actions/download-artifact@v4
        with:
          name: venc-maruko
          path: release/maruko

      - name: Prepare release archives
        run: |
          for backend in star6e maruko; do
            mkdir -p "release/venc-${backend}"
            mv "release/${backend}/venc" "release/venc-${backend}/venc"
            mv "release/${backend}/json_cli" "release/venc-${backend}/json_cli"
            if [ -d "release/${backend}/lib" ]; then
              mv "release/${backend}/lib" "release/venc-${backend}/lib"
            fi
            cp config/venc.default.json "release/venc-${backend}/venc.json"
            chmod +x "release/venc-${backend}/venc"
            chmod +x "release/venc-${backend}/json_cli"
            tar -czf "release/venc-${backend}.tar.gz" -C release "venc-${backend}"
          done

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build (v${{ steps.version.outputs.version }})"
          body: |
            Automated build from `master` branch.

            **Version:** ${{ steps.version.outputs.version }}
            **Commit:** ${{ github.sha }}

            ## Binaries

            | File | Backend | SoC | Contents |
            |------|---------|-----|----------|
            | `venc-star6e.tar.gz` | Star6E | SSC30KQ / SSC338Q (Infinity6E) | `venc` + `json_cli` + `venc.json` |
            | `venc-maruko.tar.gz` | Maruko | SSC378QE (Infinity6C) | `venc` + `json_cli` + `venc.json` + `lib/` (10 MI libs) |

            `json_cli` is a style-preserving JSON config get/set/del tool
            (vendored from `waybeam-hub/tools/`) used by deploy scripts and
            on-device automation to read and patch `/etc/venc.json`.

            ## Install

            ```bash
            # Both backends: binary + json_cli + default config
            tar -xzf venc-<backend>.tar.gz -C /tmp
            cp /tmp/venc-<backend>/venc      /usr/bin/venc
            cp /tmp/venc-<backend>/json_cli  /usr/bin/json_cli
            cp /tmp/venc-<backend>/venc.json /etc/venc.json

            # Maruko only — stock OpenIPC Infinity6C firmware does not ship MI libs:
            cp /tmp/venc-maruko/lib/*.so     /usr/lib/

            # Maruko only — vendor lib libcam_os_wrapper.so has hardcoded
            # NEEDED tags for these two uClibc loader names; create them so
            # the dynamic linker resolves on stock musl firmware:
            ln -sf libc.so /lib/ld-uClibc.so.1
            ln -sf libc.so /lib/libc.so.0
            ```

            ## Runtime library requirements

            **Star6E / Infinity6E:** all MI libs ship in stock OpenIPC firmware
            (`/rom/usr/lib/`). No bundled libraries — the tarball is binary-only.
            The binary `dlopen`s at runtime: `libmi_sys`, `libmi_isp`, `libmi_venc`,
            `libmi_rgn`, `libmi_sensor`, `libmi_vpe`, `libmi_vif`, `libmi_ai`,
            `libispalgo`, `libcam_os_wrapper`, `libcus3a`, `libopus` *(optional — Opus
            audio falls back to PCM if missing)*.

            **Maruko / Infinity6C:** stock OpenIPC firmware does **not** ship MI
            vendor libs, so the tarball bundles 10 `.so` files (~2 MB) in `lib/`.
            Copy them to `/usr/lib/` on first install. Required: `libmi_sys`,
            `libmi_isp`, `libmi_venc`, `libmi_scl`, `libmi_sensor`, `libmi_vif`,
            `libmi_common`, `libispalgo`, `libcam_os_wrapper`, `libcus3a`. Source
            and MD5s in `vendor-libs/maruko/` in the repo.

            See [README](https://github.com/${{ github.repository }}/blob/master/README.md) for usage.
          files: |
            release/venc-star6e.tar.gz
            release/venc-maruko.tar.gz
          prerelease: false
          make_latest: true

  # ── Telegram notification (optional) ───────────────────────────────

  notify:
    runs-on: ubuntu-latest
    needs: [release]
    if: vars.TELEGRAM_TOKEN != ''
    steps:
      - name: Send Telegram notification
        env:
          TG_TOKEN: ${{ vars.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ vars.TELEGRAM_CHAT }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d parse_mode=Markdown \
            -d text="✅ *waybeam_venc* release updated%0AVersion: $(cat VERSION)%0ACommit: ${GITHUB_SHA:0:7}"
